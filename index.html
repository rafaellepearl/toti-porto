<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Efraim Toti — Efraim Video</title>
<meta name="description" content="Efraim Toti — directing, writing, editing, producing, photography and videography. Click the door, walk into the video store and pull a tape off the shelf.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bowlby+One&family=Comic+Neue:wght@700&family=Space+Mono&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-place="outside">

<div class="scan" aria-hidden="true"></div>
<div class="osd osd-tl" aria-hidden="true">PLAY &#9654;</div>
<div class="osd osd-bl" aria-hidden="true"><span id="clock"></span></div>
<div id="veil" aria-hidden="true"></div>

<!-- outside -->
<header id="outside" class="place">
  <div id="zoomer">
    <canvas id="scene" role="img" aria-label="Drawing of a video rental store at night, its windows lit, mesas on the horizon"></canvas>
    <button id="door" type="button" aria-label="Open the door and walk into the store"><span class="ring"></span><span class="hint">Click the door</span></button>
  </div>
  <div class="hero-text">
    <p class="kicker">Open late &middot; every night</p>
    <h1 id="h-name"></h1>
    <p class="roles" id="h-roles"></p>
    <button class="btn" id="walk" type="button">Walk in &#9654;</button>
  </div>
</header>

<!-- inside -->
<main id="inside" class="place" aria-label="Inside the store">
  <div id="stage">
    <div class="layer" id="L-main"></div>
    <div class="layer" id="L-ceil" aria-hidden="true"></div>
    <div class="layer" id="L-fg" aria-hidden="true"></div>
  </div>
  <p id="tip" class="caption">Drag, scroll or use the arrows to browse &middot; click a tape to take it off the shelf</p>
  <button class="nav" id="prev" type="button" aria-label="Browse left">&#9664;</button>
  <button class="nav" id="next" type="button" aria-label="Browse right">&#9654;</button>
  <nav id="dots" aria-label="Jump to"></nav>
</main>

<dialog id="box" aria-labelledby="box-title">
  <button id="close" type="button">&#9167; Eject</button>
  <div class="box-in">
    <div class="box-art">
      <canvas id="box-cover" aria-hidden="true"></canvas>
      <canvas id="cassette" width="320" height="200" aria-hidden="true"></canvas>
    </div>
    <div id="panel-body"></div>
  </div>
</dialog>

<dialog id="tvbox" aria-label="Efraim TV">
  <button id="tvclose" type="button">&#9167; Off</button>
  <div class="tvset"><div id="tvscreen"></div><div class="tvknobs" aria-hidden="true"><i></i><i></i><b></b></div></div>
</dialog>

<script src="data.js"></script>
<script src="covers.js"></script>
<script src="main.js"></script>
</body>
</html>
